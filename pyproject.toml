[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fusion_neutron_utils"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
[tool.maturin]
module-name = "fusion_neutron_utils.fusion_neutron_utils"
python-source = "."
features = ["pyo3/extension-module"]
include = [
    "fusion_neutron_utils/__init__.py",
    "fusion_neutron_utils/__init__.pyi",
    "fusion_neutron_utils/fusion_neutron_utils/__init__.pyi",
    "fusion_neutron_utils/py.typed",
]

[project.optional-dependencies]
tests = ["pytest", "numpy"]
lint = ["ruff"]
types = ["mypy"]

